version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: person_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5000:80"
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=person_db;Username=postgres;Password=password
      - JwtSettings__Key=MinhaChaveSuperSecretaDe32Caracteres!
      - JwtSettings__Issuer=PersonApi
      - JwtSettings__Audience=PersonApiUser
      - ASPNETCORE_ENVIRONMENT=Production
